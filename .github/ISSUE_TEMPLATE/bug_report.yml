name: Bug report
description: Something isn't working as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.
        Before submitting, please check the [open issues](https://github.com/laiadesk-app/LaiaGit/issues)
        to see if this is a duplicate.

  - type: input
    id: version
    attributes:
      label: LaiaGit version
      description: Commit SHA or release tag (run `git rev-parse HEAD` inside the LaiaGit repo).
      placeholder: e.g. 73a2b91
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11.7
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps the maintainers can follow.
      placeholder: |
        1. Open LaiaGit
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Paste any relevant terminal output. **Redact secrets** (API keys, tokens, paths
        you don't want public).
      render: shell
